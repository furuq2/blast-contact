name: healthcheck

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC, between night and morning runs
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: blast-contact-pipeline
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run health check + self-correct
        env:
          SEASON: ${{ vars.SEASON || '2025' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.healthcheck_job
      - name: Commit DB + CSV (in case repair updated rows)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blast_contact.db data/master.csv
          git diff --staged --quiet || git commit -m "healthcheck $(date -u +%F-%H%M)"
          git push || true
      - name: Upload DB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-healthcheck-${{ github.run_number }}
          path: |
            data/blast_contact.db
            data/master.csv
          retention-days: 30
